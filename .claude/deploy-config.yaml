# .claude/deploy-config.yaml
# Generated by /deploy-setup — consumed by /deploy
# Do not delete — /deploy relies on this file for project-specific values.

schema_version: 1

project:
  name: "captablebr"
  platform: "cloud-run"

environments:
  staging:
    branch: "staging"
    url: "pending"
    gcp_project_id: "paynequity"
    health_check: "/api/health"
  production:
    branch: "main"
    url: "pending"
    gcp_project_id: "paynequity"
    health_check: "/api/health"

ci_cd:
  provider: "github-actions"
  deploy_workflow: ".github/workflows/deploy.yml"
  rollback_workflow: ".github/workflows/rollback.yml"
  auth_method: "not-configured"

reviewer:
  tech_stack: "Next.js 16, TypeScript, Prisma, Firebase Auth, Cloud Run, GCP Cloud Storage, Vertex AI, Recharts, Tailwind CSS, shadcn/ui"
  additional_rules: ""
