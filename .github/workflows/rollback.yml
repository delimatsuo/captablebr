name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to rollback"
        required: true
        type: choice
        options: [staging, production]
      revision:
        description: "Cloud Run revision to route 100% traffic to"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: paynequity
  REGION: us-central1

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: "projects/777685600587/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@paynequity.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Rollback via traffic split
        run: |
          SUFFIX="${{ inputs.environment == 'production' && '' || '-staging' }}"
          gcloud run services update-traffic "captablebr${SUFFIX}" \
            --to-revisions=${{ inputs.revision }}=100 \
            --region=${{ env.REGION }} \
            --project=${{ env.GCP_PROJECT_ID }}
