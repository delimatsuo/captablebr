name: Deploy

on:
  push:
    branches: [staging, main]

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: paynequity
  GCP_PROJECT_NUMBER: "777685600587"
  REGION: us-central1
  SERVICE_NAME: captablebr
  AR_REPO: us-central1-docker.pkg.dev/paynequity/captablebr

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: "projects/777685600587/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@paynequity.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push container image
        run: |
          IMAGE="${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          SUFFIX="${{ github.ref_name == 'main' && '' || '-staging' }}"
          gcloud run deploy "${{ env.SERVICE_NAME }}${SUFFIX}" \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-cloudsql-instances=${{ env.GCP_PROJECT_ID }}:${{ env.REGION }}:captablebr-db \
            --set-secrets=DATABASE_URL=captablebr-database-url:latest \
            --set-secrets=FIREBASE_ADMIN_KEY=captablebr-firebase-admin-key:latest \
            --set-secrets=NEXT_PUBLIC_FIREBASE_CONFIG=captablebr-firebase-client-config:latest \
            --quiet
